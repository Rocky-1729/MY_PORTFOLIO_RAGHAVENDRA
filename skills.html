```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills & Certifications</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #1d4ed8;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 35px;
            font-size: 2.5rem;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #2563eb;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .skill-card h3 {
            color: #111827;
            margin-bottom: 10px;
        }

        .skill-card p {
            color: #555;
            line-height: 1.6;
        }

        .cert-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cert-card img {
            width: 180px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #2563eb;
        }

        .cert-info h3 {
            margin-bottom: 8px;
            color: #111827;
        }

        .cert-info p {
            color: #555;
            line-height: 1.5;
        }

        .achievement-list {
            list-style: none;
        }

        .achievement-list li {
            background: #f8fafc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .achievement-list li:hover {
            transform: translateX(5px);
        }

        /* Mobile Responsive */

        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            .cert-card {
                flex-direction: column;
                text-align: center;
            }

            .cert-card img {
                width: 100%;
                max-width: 280px;
                height: auto;
            }

            .home-btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .skill-card,
            .cert-card {
                padding: 18px;
            }
        }

        @media (max-width: 480px) {

            h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 15px;
            }

            .section h2 {
                font-size: 1.3rem;
            }

            .skill-card h3,
            .cert-info h3 {
                font-size: 1.1rem;
            }

            .achievement-list li,
            .skill-card p,
            .cert-info p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="home-btn">← Back to Home</a>

        <h1>Skills & Certifications</h1>

        <!-- Keep your existing Skills, Certifications, and Achievements content here exactly as it is -->

    </div>

</body>

</html>
```
